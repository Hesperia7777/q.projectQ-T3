<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敏捷專案管理架構 題庫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1d2733;--sub:#5b6773;--line:#d5dbe1;--accent:#0e7c86;--accent-ink:#fff;--ok:#1e8e4e;--okbg:#e3f4ea;--bad:#c23a3a;--badbg:#fbe6e6;--note:#ffe27a;--note-ink:#3a2f00;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1b232c;--ink:#e6ebf0;--sub:#9aa7b3;--line:#2c3641;--accent:#4fc3cc;--accent-ink:#06262a;--ok:#5cd18a;--okbg:#17382a;--bad:#f08080;--badbg:#3d2020;--note:#e8c84a;--note-ink:#2b2200;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181f;--card:#1b232c;--ink:#e6ebf0;--sub:#9aa7b3;--line:#2c3641;--accent:#4fc3cc;--accent-ink:#06262a;--ok:#5cd18a;--okbg:#17382a;--bad:#f08080;--badbg:#3d2020;--note:#e8c84a;--note-ink:#2b2200;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
main{max-width:680px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--accent)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tab{background:var(--note);color:var(--note-ink);font-size:13px;padding:4px 16px;display:flex;justify-content:space-between}
.q{padding:16px 16px 6px;font-size:17px;font-weight:500;margin:0}
.opts{padding:8px 12px 14px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;align-items:flex-start}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);display:grid;place-items:center;font-size:13px;color:var(--sub);margin-top:1px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}.opt[aria-disabled="true"]{cursor:default}
.fb{margin:0 12px 14px;padding:9px 12px;border-radius:8px;font-size:15px;font-weight:500}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:0 0 14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.g{padding:6px 0;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px}
.g.done{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:var(--accent)}
.g.ok{background:var(--okbg);border-color:var(--ok)}.g.bad{background:var(--badbg);border-color:var(--bad)}
.g.cur{outline:2px solid var(--ink);outline-offset:1px}
.hero{padding:24px 18px}
.hero h2{margin:0 0 6px;font-size:22px}
.hero p{margin:6px 0;color:var(--sub)}
.score{font-size:46px;font-weight:700;line-height:1.1;margin:4px 0}
.stats{display:flex;gap:18px;color:var(--sub);font-size:14px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.wr{margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;font-size:15px}
.wr b{font-weight:500}.wr .a{color:var(--bad)}.wr .c{color:var(--ok)}
h3{font-size:16px;margin:22px 0 0}
</style>
</head>
<body>
<header><div class="bar">
 <h1>敏捷專案管理架構 題庫</h1>
 <div class="seg" role="group" aria-label="作答模式">
  <button data-mode="instant" aria-pressed="true">即時對答案</button>
  <button data-mode="exam" aria-pressed="false">交卷模式</button>
 </div>
</div></header>
<main id="app"></main>
<script>
const Q = [{"n": 1, "q": "判斷團隊是否實踐敏捷，最主要的依據是什麼？", "o": ["是否使用指定的專案管理軟體", "是否符合敏捷的4個價值觀與12項原則", "是否完全取消專案文件", "是否每天變更工作目標"], "a": 1, "p": 1.0}, {"n": 2, "q": "APMF敏捷專案管理架構的核心目的為何？", "o": ["讓所有專案採用相同的工作流程", "將專案文件數量降至最低", "將專案決策集中於主管", "協助團隊將專案的商業價值最大化"], "a": 3, "p": 1.0}, {"n": 3, "q": "敏捷專案管理是哪兩種管理方式的融合與協調？", "o": ["科學化管理與人性化管理", "財務管理與行銷管理", "集權管理與行政管理", "品質管理與設備管理"], "a": 0, "p": 1.0}, {"n": 4, "q": "APMF架構以哪四個面向說明專案的運作？", "o": ["成本、品質、採購、風險", "需求、設計、開發、維護", "參與人員、階段、工作事項、產出", "願景、預算、績效、獎酬"], "a": 2, "p": 1.0}, {"n": 5, "q": "敏捷專案在一開始應如何規劃？", "o": ["完成全部需求細節後才核准專案", "先做大方向規劃，再逐步細化", "預先固定所有迭代的工作細節", "等第一次發布後才建立專案方向"], "a": 1, "p": 1.0}, {"n": 6, "q": "敏捷專案每次發布增量成果後，取得客戶回饋的主要用途為何？", "o": ["作為延後驗收的依據", "證明原始規劃不需調整", "取代後續所有測試活動", "修改本次產品，並調整後續規劃"], "a": 3, "p": 1.0}, {"n": 7, "q": "下列哪一項工作屬於「可行性分析階段」？", "o": ["準備營運企劃案與核准專案", "開發並測試增量成果", "進行每日立會", "進行迭代回顧"], "a": 0, "p": 1.0}, {"n": 8, "q": "「產品盒、願景卡」主要對應下列哪一項工作？", "o": ["估算用戶故事點數", "準備驗收測試案例", "建立專案共同的願景", "結束專案活動"], "a": 2, "p": 1.0}, {"n": 9, "q": "下列何者是「起始階段」的工作？", "o": ["進行發布回顧", "建立產品地圖", "交付最終專案成果", "開發本次迭代的增量成果"], "a": 1, "p": 1.0}, {"n": 10, "q": "敏捷專案章程包含下列哪兩項內容？", "o": ["專案章程與團隊章程", "採購契約與保固契約", "測試案例與測試報告", "發布紀錄與驗收紀錄"], "a": 0, "p": 1.0}, {"n": 11, "q": "起始階段所產出的「角色卡」，主要用於什麼目的？", "o": ["記錄每日出勤情形", "計算成員績效獎金", "取代產品待辦清單", "更詳細地描述利害關係人"], "a": 3, "p": 1.0}, {"n": 12, "q": "下列哪一項屬於「發布循環階段」的工作？", "o": ["首次核准專案", "建立最初的專案共同願景", "分解用戶故事並定義驗收標準", "結束所有專案活動"], "a": 2, "p": 1.0}, {"n": 13, "q": "在發布循環中，「刺探」（Spike）的用途為何？", "o": ["蒐集下一迭代用戶故事的細節資料", "決定團隊成員的升遷順序", "取消尚未完成的所有需求", "取代發布回顧會議"], "a": 0, "p": 1.0}, {"n": 14, "q": "下列哪一項是迭代循環子階段的產出？", "o": ["營運企劃案", "通過驗收測試的增量成果", "專案核准文件", "產品盒與願景卡"], "a": 1, "p": 1.0}, {"n": 15, "q": "專案結束階段應進行下列哪一項活動？", "o": ["辨識專案角色", "建立產品待辦清單", "蒐集下一迭代的需求細節", "交付專案成果並進行專案回顧"], "a": 3, "p": 1.0}, {"n": 16, "q": "某次發布包含2次迭代，每次迭代2週。若不另計其他時間，該次發布共需幾週？", "o": ["不一定，視狀況而定。", "2週", "4週", "8週"], "a": 2, "p": 1.0}, {"n": 17, "q": "下列有關迭代工作方式的描述，何者正確？", "o": ["在迭代內同步進行分析、設計、寫程式與測試", "第一個迭代負責分析，最後一個迭代負責測試", "程式都撰寫完成之時，就是測試者開始加入團隊的時間", "所有發布結束後，才進行產品測試"], "a": 0, "p": 1.0}, {"n": 18, "q": "下列關於「時間盒」（Time Boxing）主要意義的敘述，何者正確？", "o": ["由成員自行決定何時結束所有工作", "只記錄工作時間，不設定完成期限", "因為是個黑盒子，方便工作未完成時，可延長原定週期", "將專案、發布、迭代與會議限制在固定時間內"], "a": 3, "p": 1.0}, {"n": 19, "q": "依照業界最佳工作實務，每日立會的時間，一般設定為多久？", "o": ["5分鐘", "15分鐘", "45分鐘", "60分鐘"], "a": 1, "p": 1.0}, {"n": 20, "q": "當一個迭代內的用戶故事工作都完成後，應接著進行什麼？", "o": ["直接開始下一個迭代", "立即結束整個專案", "進行迭代審查與回顧", "重新進行專案可行性分析"], "a": 2, "p": 1.0}, {"n": 21, "q": "下列哪一種描述最符合敏捷團隊的定義？", "o": ["充分授權、自我組織的跨職能團隊", "由主管逐項分派工作的單一專業團隊", "不需要與客戶溝通的獨立團隊", "由個別成員各自完成工作的臨時集合"], "a": 0, "p": 1.0}, {"n": 22, "q": "團隊成員主動從待辦清單中拿取適合的工作，而非等待主管指派，主要展現哪一項特質？", "o": ["會議紀律", "團隊競爭", "自律", "績效考核機制"], "a": 2, "p": 1.0}, {"n": 23, "q": "「共同分擔責任」最適合以下列哪一種行為呈現？", "o": ["制定層層負責的階層式管理制度", "由敏捷教練和專案負責人共同承諾所有工作", "將工作落後的責任交由客戶承擔", "成員共同制定並承諾計畫，互相協助完成任務"], "a": 3, "p": 1.0}, {"n": 24, "q": "團隊將規劃、流程、決策及迭代狀況以圖表展示在牆上，主要是為了什麼？", "o": ["減少成員參與決策的機會", "提高透明度，協助及早發現問題", "取代團隊成員之間的所有討論", "讓主管能完全控制每個人的工作方式"], "a": 1, "p": 1.0}, {"n": 25, "q": "敏捷團隊如何兼顧靈活性與公司標準？", "o": ["因為敏捷團隊是自我組織的團隊，所以可不遵守公司制度，較具靈活性", "取消公司標準，額外建立團隊規則", "在公司制度與標準下，允許靈活選擇合適的工作方式", "所有團隊都必須採用完全相同的工作細節"], "a": 2, "p": 1.0}, {"n": 26, "q": "依據APMF的團隊範圍說明，下列哪組角色位於敏捷團隊外圈，雖非團隊成員，卻對專案影響重大？", "o": ["贊助者與利害關係人", "產品負責人與敏捷教練", "團隊成員與測試者", "敏捷教練與測試者"], "a": 0, "p": 1.0}, {"n": 27, "q": "「利害關係人」是指？", "o": ["提供經費的個人或組織", "參與程式開發的個人或組織", "專案成果的最終購買者", "參與專案、受專案影響，或可能影響專案的個人與組織"], "a": 3, "p": 1.0}, {"n": 28, "q": "敏捷專案管理與傳統專案管理最大的不同為何？", "o": ["敏捷專案不需要管理利害關係人", "將客戶或利害關係人代表納入敏捷團隊", "敏捷專案沒有時間與資源限制", "工作主要交由產品負責人執行"], "a": 1, "p": 1.0}, {"n": 29, "q": "開發團隊通常具有下列哪一項特徵？", "o": ["通常少於12人，並具有跨職能特性", "人數越多越好，工作比較容易快速做完", "所有人都必須精通每一種工作", "團隊成員最好都擁有同樣專長，比較好溝通"], "a": 0, "p": 1.0}, {"n": 30, "q": "「通用專家」（Generalizing Specialists）的意義為何？", "o": ["對所有工作都有認識，但沒有任何專長", "每位成員都必須精通全部專業領域", "成員擁有多項專精，能互相支援，但不必樣樣精通", "每位成員只能從事一種固定工作"], "a": 2, "p": 1.0}, {"n": 31, "q": "團隊成員依專長選取待辦清單最上方的工作，主要考量為何？", "o": ["優先選擇最容易完成的工作", "優先選擇對客戶價值最高的工作", "優先選擇主管最熟悉的工作", "優先選擇不需要合作的工作"], "a": 1, "p": 1.0}, {"n": 32, "q": "關於敏捷教練的工作，下列哪個說法較正確？", "o": ["代替產品負責人決定所有產品功能", "負責決定工作待辦清單裡各工作的優先順序", "負責處理團隊問題", "協助團隊自我組織、建立信任並移除障礙"], "a": 3, "p": 1.0}, {"n": 33, "q": "「流程裁適」（Process Tailoring）是指什麼？", "o": ["根據企業需求，從一般性框架中挑選並整合適合的流程", "所有企業一律採用相同的完整流程", "根據總裁的決定來調整企業流程", "將企業需求調整成完全符合既定流程"], "a": 0, "p": 1.0}, {"n": 34, "q": "下列哪一項是產品負責人／客戶的主要責任？", "o": ["提供全部專案財務資源", "親自執行所有開發與測試工作", "擁有產品待辦清單，決定工作內容與優先順序", "代替所有成員選擇每日工作的技術方法"], "a": 2, "p": 1.0}, {"n": 35, "q": "下列哪一項是贊助者的主要工作？", "o": ["撰寫所有驗收測試案例", "提供專案目標與財務資源，關注產品價值及成本", "每日逐一指派開發人員的工作", "取代產品負責人維護每張用戶故事卡"], "a": 1, "p": 1.0}, {"n": 36, "q": "從傳統領導轉向僕人式領導時，領導者應進行哪一項主要轉變？", "o": ["從協助團隊轉向加強命令控制", "從授權成員轉向集中所有決策", "從關注成長轉向只關注個人績效", "從親自解決問題轉向提倡授權與協助成員成長"], "a": 3, "p": 1.0}, {"n": 37, "q": "當主管從「命令與控制」轉向僕人式領導時，最需要練習的能力為何？", "o": ["積極傾聽", "加強監督", "自我反思", "爭取資源"], "a": 0, "p": 1.0}, {"n": 38, "q": "積極傾聽的有效步驟，依序為何？", "o": ["傾聽、判斷、回應", "傾聽、瞭解、回應", "傾聽、分析、考核", "傾聽、瞭解、紀錄"], "a": 1, "p": 1.0}, {"n": 39, "q": "團隊遇到問題時，下列哪一種回應最符合僕人式領導？", "o": ["「你就照著我給你的這個辦法做就可以。」", "「這是你的問題，既是自我組織的團隊，就應自行承擔。」", "「你有什麼建議？需要協助時請讓我知道。」", "「先停止所有工作，等我決定每一個細節。」"], "a": 2, "p": 1.0}, {"n": 40, "q": "情緒智商（EQ）主要指哪一種能力？", "o": ["快速完成技術工作的能力", "記住團隊所有規章的能力", "以職權壓制不同意見的能力", "瞭解與管理情緒、社會互動及人際關係的能力"], "a": 3, "p": 1.0}, {"n": 41, "q": "下列何者是EQ的四個構面？", "o": ["自我察覺、自我管理、社會察覺、人際關係管理", "成本管理、品質管理、採購管理、風險管理", "願景設定、需求分析、程式開發、產品測試", "專業知識、文件寫作、時程安排、預算編列"], "a": 0, "p": 1.0}, {"n": 42, "q": "團隊規範（Team Norms）應如何建立？", "o": ["由贊助者單方面規定所有工作細節", "等專案結束後，再整理成員習慣", "團隊共同制定工作協定，並一致同意遵守", "讓每位成員自行訂定規則，自己管自己"], "a": 2, "p": 1.0}, {"n": 43, "q": "「調適性領導」（Adaptive Leadership）是指？", "o": ["調適能力很強的主管", "依團隊不同發展階段，採用不同領導方式", "完全不須領導者就能自行處理所有問題的團隊", "只在專案發生重大失敗後才介入"], "a": 1, "p": 1.0}, {"n": 44, "q": "高效能團隊的四個發展階段，正確順序為何？", "o": ["建立期、風暴期、高效期、規範期", "規範期、建立期、風暴期、高效期", "建立期、規範期、高效期、風暴期", "建立期、風暴期、規範期、高效期"], "a": 3, "p": 1.0}, {"n": 45, "q": "團隊成員正處於互相挑戰、意見碰撞的階段，最可能是處於高效能團隊發展的哪一期？", "o": ["風暴期", "高效期", "規範期", "建立期"], "a": 0, "p": 1.0}, {"n": 46, "q": "團隊成員以事實為基礎分享資訊，並互相合作，屬於哪一個衝突等級？", "o": ["第2級「不同意」", "第3級「競爭」", "第1級「解決問題」", "第4級「聖戰」"], "a": 2, "p": 1.0}, {"n": 47, "q": "面對第2級「不同意」的衝突，宜採用哪一種管理方式？", "o": ["立即解散團隊", "支持並授權每個人解決問題", "停止所有資訊分享", "以法務手段建立安全結構"], "a": 1, "p": 1.0}, {"n": 48, "q": "當團隊成員認為「贏得勝利比解決問題更重要」，且言語出現人身攻擊時，最可能屬於哪一級衝突？", "o": ["第1級「解決問題」", "第2級「不同意」", "第5級「世界大戰」", "第3級「競爭」"], "a": 3, "p": 1.0}, {"n": 49, "q": "面對第4級「聖戰」衝突，應如何處理較好？", "o": ["建立安全的結構，並使用外交手段", "只要求成員增加資訊分享即可", "鼓勵各團體持續爭取勝利", "完全不介入，等待衝突自行消失"], "a": 0, "p": 1.0}, {"n": 50, "q": "第5級「世界大戰」衝突的管理重點為何？", "o": ["鼓勵成員繼續辯論立場", "立即進行產品功能排序", "盡一切必要努力，避免互相傷害", "讓雙方各自訂定更高的競爭目標"], "a": 2, "p": 1.0}, {"n": 51, "q": "下列哪一種溝通方式的效率與效能最高？", "o": ["僅以紙本文件單向傳遞資訊", "兩人面對面利用白板討論", "播放影片且不開放問答", "僅透過文字公告傳達決策"], "a": 1, "p": 1.0}, {"n": 52, "q": "「高頻寬溝通」，主要是指什麼？", "o": ["使用容量較大的電子郵件附件", "增加每週書面報告的頁數", "使用速度最快的傳輸網路", "面對面的雙向溝通"], "a": 3, "p": 1.0}, {"n": 53, "q": "工作距離與溝通成本的關係為何？", "o": ["距離越遠，溝通成本通常越高", "距離越遠，溝通成本一定越低", "距離不會影響溝通成本", "只有跨國距離才會影響溝通成本"], "a": 0, "p": 1.0}, {"n": 54, "q": "「滲透式溝通」主要是如何發生的？", "o": ["每位成員每天繳交個人報告", "成員在共同空間中，透過聆聽周遭對話掌握資訊", "由秘書紀錄詳細會議內容再轉傳給所有團隊成員", "將所有正式公文改成Memo"], "a": 1, "p": 1.0}, {"n": 55, "q": "敏捷團隊集中辦公的空間，又可稱為什麼？", "o": ["資源中心", "行政中心", "作戰室", "資訊中心"], "a": 2, "p": 1.0}, {"n": 56, "q": "下列何者屬於良好團隊空間配置？", "o": ["主管辦公室最好不要跟員工的在一起，以免製造壓力", "取消討論環境，避免成員互相干擾", "每人最好都有獨立的一間辦公室", "提供資訊發布站、討論環境與支援工具"], "a": 3, "p": 1.0}, {"n": 57, "q": "下列哪一項是遠距團隊的優點？", "o": ["能吸納更多人才，並增加文化多樣性", "可以完全避免溝通問題", "不再需要團隊工作協定", "不需要進行任何協同工作"], "a": 0, "p": 1.0}, {"n": 58, "q": "為提高遠距團隊的專案成功機會，應該怎麼做較好？", "o": ["開會的時候大家都把攝像頭打開，以利看清楚彼此", "若條件允許，先共同工作，再分地工作", "所有成員把文件寫得更仔細一點，以文件取代討論，以利留下證據", "將全部決策交由各地成員自行處理，避免整合困難"], "a": 1, "p": 1.0}, {"n": 59, "q": "無論是專案、發布或迭代，敏捷教練在初期、中期與末期應如何安排指導方式？", "o": ["初期個別教練、中期全隊教練、末期個別教練", "初期全隊教練、中期全隊教練、末期停止指導", "初期全隊教練、中期個別教練、末期全隊教練", "初期停止指導、中期個別教練、末期個別教練"], "a": 2, "p": 1.0}, {"n": 60, "q": "下列哪一個問題最適合在每日立會中提出？", "o": ["「公司明年的整體組織架構要如何調整？」", "「下一個年度應採用哪一種領導理論？」", "「整個專案結束後應如何分配獎金？」", "「目前有什麼問題或阻礙會影響你的工作進展？」"], "a": 3, "p": 1.0}, {"n": 61, "q": "某團隊準時完成所有原訂功能，但客戶認為這些功能已不符合目前的營運需要。依APMF的核心理念，最適當的判斷為何？", "o": ["準時完成原訂功能，就代表專案已達成最高價值", "問題完全來自客戶，因不再當初的合約裡，所以不需要調整專案管理方式", "團隊應重新檢視專案願景與商業價值，據以調整後續工作", "增加測試次數，以確保功能符合客戶目前需要"], "a": 2, "p": 1.0}, {"n": 62, "q": "某公司導入敏捷時，要求每個部門完全照搬同一套流程，不得調整。依你對敏捷的了解，你覺得應該要採取下列哪一項建議做調整會比較恰當？", "o": ["維持敏捷價值觀與原則，再依組織文化及需求裁適流程", "尊重成員的意願，必要時可取消或更動敏捷價值觀與原則無妨", "將所有流程改為個人自行決定，不需要共同架構", "先固定工具，再要求所有專案改變目標以配合工具"], "a": 0, "p": 1.0}, {"n": 63, "q": "某團隊在第一次發布後收到客戶回饋，只修正已交付的功能，卻不調整後續規劃。此做法最主要忽略了什麼？", "o": ["發布後應立即結束專案", "客戶回饋只能用於最終驗收", "後續規劃只能由贊助者更動", "回饋也應用於修正後續規劃，落實漸進明細"], "a": 3, "p": 1.0}, {"n": 64, "q": "某專案尚未確認共同願景與商業論證，就開始進行詳細的用戶故事點數估算。依APMF階段安排，最應優先補足哪一項工作？", "o": ["準備所有迭代的驗收測試案例", "完成可行性分析所需的願景、營運企劃案與專案核准", "進行專案結束回顧", "決定每日立會的發言順序"], "a": 1, "p": 1.0}, {"n": 65, "q": "團隊正在建立角色卡、進行高階估算，並繪製產品地圖。這組工作最可能屬於APMF的哪一階段？", "o": ["可行性分析階段", "結束階段", "起始階段", "迭代審查階段"], "a": 2, "p": 1.0}, {"n": 66, "q": "某團隊已準備展開下一迭代，但對其中一項用戶故事的細節仍不清楚。在這種狀況下，最適合運用哪一項活動補足資料？", "o": ["可行性分析", "迭代審查", "迭代回顧", "刺探（Spike）"], "a": 3, "p": 1.0}, {"n": 67, "q": "某團隊準備依下列順序進行工作：①迭代規劃、②開發與測試增量成果、③迭代審查與回顧、④下一迭代規劃。下列敘述何者正確？", "o": ["此順序能讓團隊將本次檢視與回顧的發現帶入下一次規劃", "應將③移至整個專案結束後才進行", "應取消②中的測試，留到迭代完成後進行", "應先完成④，才可討論本次迭代的改進事項"], "a": 0, "p": 1.0}, {"n": 68, "q": "某團隊每兩週完成一次迭代，但從未將成果交付客戶。團隊宣稱：「只要持續迭代，就已充分實現敏捷。」你身為敏捷專案經理，你的看法是？", "o": ["正確，迭代是敏捷最重要的核心，有持續迭代即可", "仍應透過發布交付有價值的增量成果，並取得客戶回饋", "正確，客戶只需在最後專案最終驗收時滿意即可", "應取消迭代，改為一次完成全部成果"], "a": 1, "p": 1.0}, {"n": 69, "q": "某次發布包含3次迭代，每次迭代2週。團隊規劃連續進行2次相同安排的發布。若不另計其他時間，總共需要多久？", "o": ["6週", "8週", "10週", "12週"], "a": 3, "p": 1.0}, {"n": 70, "q": "團隊預計在下一次規劃前，先討論本次合作方式與流程有哪些地方可以改善。下列哪一組「活動與產出」最符合此目的？", "o": ["可行性分析與產品盒", "角色辨識與角色卡", "回顧會議與改進行動方案", "高階估算與產品地圖"], "a": 2, "p": 1.0}, {"n": 71, "q": "團隊成員表示：「自我組織就是每個人各做各的，完成自己的部分就好。」下列哪一項最能指出此說法的問題？", "o": ["自我組織仍要求共同承諾、分擔責任及互相支援", "自我組織要求所有工作都由主管指派", "自我組織表示不需要與客戶溝通", "自我組織只適用於沒有共同目標的工作"], "a": 0, "p": 1.0}, {"n": 72, "q": "某成員已完成自己的工作，但另一位成員的高優先工作遇到困難。在此情況下，最符合敏捷團隊精神的做法為何？", "o": ["優先挑選較容易完成的低價值工作，增加個人完成件數", "等敏捷教練下令後，才考慮是否協助", "將困難工作退回產品負責人，要求他親自完成", "在能力範圍內提供支援，協助團隊完成共同承諾"], "a": 3, "p": 1.0}, {"n": 73, "q": "某開發人員認為高商業價值的工作較困難，因此只挑選清單底部自己熟悉的工作。針對這種情況，最適當的調整方式為何？", "o": ["只要個人工作速度快，就不需要考慮清單排序", "依專長優先承接高價值工作，必要時與其他成員合作", "將所有困難工作保留到專案最後處理", "由贊助者取代開發人員完成困難工作"], "a": 1, "p": 1.0}, {"n": 74, "q": "某公司認為「通用專家」代表每個人都必須精通所有技術，才能加入敏捷團隊。針對這個說法，下列哪一項修正最適當？", "o": ["成員完全不需具備專長，只需願意參與", "成員應只保留一項專長，以免分散注意力", "成員應具備多項專精並能互助，但不必樣樣精通", "團隊只需要一位精通全部工作的成員，其餘人員不需學習"], "a": 2, "p": 1.0}, {"n": 75, "q": "某團隊允許成員自行安排工作，但要求所有人完全照主管指定的方式執行，且不得提出改進。這種情況反應的是？", "o": ["此安排充分落實了自下而上的智慧", "此安排削弱了自我組織與團隊改善工作方式的空間", "只要成員能自行選擇上班時間，就代表充分授權", "敏捷團隊本來就不應參與流程決策"], "a": 1, "p": 1.0}, {"n": 76, "q": "產品負責人長期無法聯繫，且對需求優先順序沒有決策權。這最可能造成哪一項問題？", "o": ["團隊難以及時確認工作方向，並將生產力轉換為價值", "團隊可以因此省略所有需求確認", "敏捷教練自然取得所有產品決策權", "贊助者不再需要關注產品價值"], "a": 0, "p": 1.0}, {"n": 77, "q": "多位主管分別要求團隊優先處理自己的需求，導致工作順序互相衝突。最適當的處理方式為何？", "o": ["讓每位開發人員自行選擇要聽從哪位主管", "以提出需求者的職級決定優先順序", "由產品負責人整合需求，依商業價值排定優先順序", "將所有需求設為最高優先，要求團隊同時完成"], "a": 2, "p": 1.0}, {"n": 78, "q": "下列哪一組分工最符合敏捷團隊的運作方式？", "o": ["贊助者決定所有技術細節，測試者決定產品價值", "敏捷教練提供全部經費，產品負責人移除所有組織障礙", "開發團隊決定全部產品優先順序，產品負責人執行每日測試", "產品負責人決定做什麼及順序，敏捷教練協助團隊合作與排除障礙"], "a": 3, "p": 1.0}, {"n": 79, "q": "當某專案發生跨部門資源障礙，團隊成員無法自行排除時，敏捷教練該做什麼？", "o": ["協助移除障礙，必要時與贊助者或發起人協調", "要求成員在沒有資源的情況下照原計畫完成", "直接取消產品負責人的需求決策權", "將問題留到專案結束時再討論"], "a": 0, "p": 1.0}, {"n": 80, "q": "贊助者認為已提供經費，因此不需要參加任何成果審查。你做為資深敏捷經理，你的建議是？", "o": ["同意，出錢的是大爺，他提供財務資源後本就不需再參與", "應參加發布與迭代審查，了解增量成果及其價值", "應改為每日透過產品負責人替所有成員指派工作", "只需檢查工時紀錄，不需檢視成果"], "a": 1, "p": 1.0}, {"n": 81, "q": "團隊詢問敏捷教練應如何解決某項問題。下列哪一項回應最能同時展現授權與支持？", "o": ["「等我找出唯一正確的答案，你們再開始。」", "「你們自己決定，我不干預。」", "「先照過去的方法試試看。」", "「你們認為有哪些可行方法？需要哪些資源或協助？」"], "a": 3, "p": 1.0}, {"n": 82, "q": "一個總是幫團隊做為所有決策、自稱採取僕人式領導的主管。其最主要的問題為何？", "o": ["提供協助過少，應增加命令次數", "沒有要求團隊取消共同願景", "持續代替團隊思考，限制成員自主決策與成長", "未將全部問題轉交贊助者處理"], "a": 2, "p": 1.0}, {"n": 83, "q": "在討論衝突時，敏捷教練先完整聽取成員說法，再確認自己是否理解，最後提出回應。此做法最符合哪一項概念？", "o": ["流程裁適", "積極傾聽", "高階估算", "角色辨識"], "a": 1, "p": 1.0}, {"n": 84, "q": "某成員察覺自己因進度落後而焦躁，並主動調整表達方式，避免將情緒發洩在同事身上。此情境主要結合哪兩項EQ能力？", "o": ["自我察覺與自我管理", "社會察覺與自我管理", "社會察覺與積極傾聽", "人際關係管理與情緒控制"], "a": 0, "p": 1.0}, {"n": 85, "q": "團隊規範由所有成員共同同意，但有一位資深成員主張自己不必遵守。這時，最適當的處理原則為何？", "o": ["因為他夠資深，可讓他自行決定是否適用", "本就只有新進人員需要遵守團隊規範", "共同制定的基本原則適用於全體團隊成員", "團隊規範只供參考，不應影響行為"], "a": 2, "p": 1.0}, {"n": 86, "q": "某主管不論團隊處於建立期或高效期，都採用完全相同的指導方式。他最應補強哪一項能力？", "o": ["多角化經營", "調適性領導", "積極傾聽", "APMF"], "a": 1, "p": 1.0}, {"n": 87, "q": "某團隊的成員原本互相挑戰，後來逐漸建立共同工作方式，開始順利合作。依團隊發展階段，他們最可能是正發生哪一項轉變？", "o": ["高效期轉為建立期", "規範期轉為風暴期", "建立期轉為結束期", "風暴期轉為規範期"], "a": 3, "p": 1.0}, {"n": 88, "q": "團隊成員能以共同目標協調行動，整體運作如同一個合作單位。最接近哪一階段？", "o": ["高效期", "建立期", "風暴期", "可行性分析期"], "a": 0, "p": 1.0}, {"n": 89, "q": "兩位成員對方案持不同意見，但仍以事實交換資訊，並願意尋找雙贏結果。此時，最適當的管理方式為何？", "o": ["立即建立隔離結構，禁止雙方接觸", "促進合作，持續聚焦問題與雙贏結果", "將雙方視為已進入第5級衝突", "要求其中一方放棄意見，以利專案進行"], "a": 1, "p": 1.0}, {"n": 90, "q": "某次討論逐漸從比較方案，轉為「一定要證明對方能力不足」，並開始出現人身攻擊。此時，最適當的介入方式為何？", "o": ["只增加書面報告，不處理衝突", "鼓勵雙方持續競爭，直到其中一方認輸", "認定這只是正常資訊分享，不需介入", "進行調停、談判，並協助取得事實"], "a": 3, "p": 1.0}, {"n": 91, "q": "兩個小組將焦點放在保護自己的團體，並以意識形態標籤指責對方。你判斷這情況是？", "o": ["屬於第1級衝突，應直接放任合作", "屬於第2級衝突，只需分派更多工作", "接近第4級衝突，應建立安全結構並採取外交手段", "屬於正常的迭代審查，不需要衝突管理"], "a": 2, "p": 1.0}, {"n": 92, "q": "某團隊衝突升高，雙方以摧毀對方為目標，且幾乎不再交談。此時最優先的處理目標為何？", "o": ["避免彼此傷害", "加快下一迭代的點數估算", "增加產品待辦清單的項目", "立即要求雙方共同承諾更多工作"], "a": 0, "p": 1.0}, {"n": 93, "q": "團隊透過大量電子郵件討論模糊需求，往返多次仍無共識。最適當的改善方式為何？", "o": ["增加副本收件人，讓更多人收到同樣內容", "將每封郵件改得更長，減少即時互動", "將討論延至專案最終驗收", "安排面對面白板討論，透過雙向問答澄清需求"], "a": 3, "p": 1.0}, {"n": 94, "q": "公司將原本同室工作的團隊分散到不同樓層，卻未補充其他溝通安排。最可能受到影響的是什麼？", "o": ["自然聆聽周遭對話的機會減少，溝通成本可能增加", "團隊一定能獲得更多滲透式溝通", "因距離增加，團隊就不再需要共同規範", "所有成員的技術能力會立即下降"], "a": 0, "p": 1.0}, {"n": 95, "q": "某公司設置團隊作戰室，但禁止成員討論，也不展示任何專案資訊。最合理的評估為何？", "o": ["只要空間名稱是作戰室，就已達成目的", "禁止討論能充分發揮集中辦公的價值", "雖集中辦公，卻未充分發揮促進溝通與團隊意識的功能", "資訊應只提供給主管，才符合保密原則"], "a": 2, "p": 1.0}, {"n": 96, "q": "某跨國遠距團隊成員能力優秀，合作卻持續不順。下列哪一項分析最合理？", "o": ["人才優秀就足以保證合作，不需檢視其他因素", "除專業能力外，還應檢視溝通協作、時區、階級意識及文化差異", "遠距團隊不適合建立共同工作方式", "只要增加每日個人工時，就能排除所有問題"], "a": 1, "p": 0.5}, {"n": 97, "q": "某專案的流程與文件都很完整，但團隊不願合作，也不接受客戶回饋。最適當的改善方向為何？", "o": ["增加文件頁數，讓流程更完整", "將所有問題交由主管逐項裁決", "同時檢視管理流程與人的互動，恢復價值導向及協作", "停止與客戶接觸，避免需求變動"], "a": 2, "p": 0.5}, {"n": 98, "q": "敏捷教練要安排一個迭代的指導方式，下列哪一項最適當？", "o": ["初期只進行個別指導，末期不再參與", "初期個別教練，中期全隊教練，末期再進行個別教練", "只有發生嚴重衝突時才提供全隊指導", "初期全隊教練，中期個別教練，末期再進行全隊教練"], "a": 3, "p": 0.5}, {"n": 99, "q": "每日立會中，某成員提出目前工作遭遇的阻礙，接著有人建議立即在會中重新設計公司整體制度。此時，最適當的處理方式為何？", "o": ["讓會議持續進行，直到公司制度完全討論完畢", "先掌握影響工作進展的阻礙，較深入的議題另行安排，維持時間盒", "禁止成員提出任何阻礙，以免超時", "取消每日立會，改由每月一次的會議處理所有問題"], "a": 1, "p": 0.5}, {"n": 100, "q": "某團隊想同時落實「價值驅動」「自我組織」及「持續改善」。下列哪一組做法最合理？", "o": ["產品負責人依價值排序，成員依專長主動承接並互助，回顧後提出改進行動", "主管依職級排序需求，成員等待指派，專案結束後才討論問題", "成員自行選擇最容易的工作，不必參考共同願景或待辦清單", "固定所有需求與流程，避免因客戶回饋而調整計畫"], "a": 0, "p": 0.5}, {"n": 101, "q": "下列哪一個問題適合在「每日立會」中提出？", "o": ["你明天預計完成哪些工作？", "你碰到的困難是什麼？", "我們的團隊要如何才能增加效率？", "我們的團隊要如何才能讓事情有效果?"], "a": 1, "p": 0.5}, {"n": 102, "q": "當迭代內的工作完成後，接下來要進行的是？", "o": ["下一個迭代", "下一個發布", "回顧", "規劃會議"], "a": 2, "p": 0.5}, {"n": 103, "q": "在敏捷專案中，「產品地圖」會在何時產生？", "o": ["在交付開始時", "在迭代開始時", "在回顧時", "在專案起始時"], "a": 3, "p": 0.5}, {"n": 104, "q": "在敏捷專案中，當發布完成後，接下來要進行的是？", "o": ["下一個發布", "下一個迭代", "回顧", "規劃會議"], "a": 2, "p": 0.5}, {"n": 105, "q": "下列何者是適合用來進行「回顧(Retrospective)」的時機？", "o": ["在展示與審查時", "每日立會時", "迭代規劃時", "在規劃前"], "a": 3, "p": 0.5}];
const L = ['A','B','C','D'];
const st = {mode:'instant', order:[], idx:0, ans:{}, submitted:false, view:'start', grid:false, confirm:false};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => +n.toFixed(1);
const total = Q.reduce((s,q) => s+q.p, 0);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){st.order=shuffle(list||Q.map((_,i)=>i));st.idx=0;st.ans={};st.submitted=false;st.view='quiz';st.grid=false;st.confirm=false;render();window.scrollTo(0,0)}
function revealed(qi){return st.submitted || (st.mode==='instant' && st.ans[qi]!==undefined)}
function go(k){st.idx=Math.max(0,Math.min(st.order.length-1,k));st.confirm=false;render();window.scrollTo(0,0)}
function pick(i){const qi=st.order[st.idx];if(revealed(qi))return;st.ans[qi]=i;st.confirm=false;render()}
function finish(){
  const un=st.order.length-Object.keys(st.ans).length;
  if(un>0 && !st.confirm){st.confirm=true;render();return}
  st.submitted=true;st.view='result';st.confirm=false;render();window.scrollTo(0,0)
}

function startHTML(){
  const m = st.mode==='instant'
    ? '每題選完立刻顯示對錯與正確答案，該題隨即鎖定。'
    : '作答中不顯示對錯，可隨時修改；按「交卷」後才公布成績與解答。';
  return `<div class="card hero"><h2>第三章 敏捷專案管理架構</h2>
  <p>共 ${Q.length} 題單選題，滿分 ${fmt(total)} 分。每次開始都會重新隨機排列題目。</p>
  <p><b>目前模式：</b>${st.mode==='instant'?'即時對答案':'交卷模式'}。${m}</p>
  <p>作答途中也可以從上方切換模式。</p>
  <div class="stack"><button class="btn pri" data-act="start">開始練習</button></div></div>`;
}

function quizHTML(){
  const N=st.order.length, qi=st.order[st.idx], q=Q[qi], rev=revealed(qi), a=st.ans[qi];
  const done=Object.keys(st.ans).length, un=N-done;
  let top='';
  if(!st.submitted){
    const lbl = st.confirm ? `還有 ${un} 題未答，確定結束？` : (st.mode==='exam'?'交卷':'結束並看成績');
    top=`<button class="chip pri" data-act="finish">${lbl}</button>`;
  } else top=`<button class="chip pri" data-act="result">回到成績</button>`;
  const grid = st.grid ? `<div class="grid">${st.order.map((qj,k)=>{
    let c='g'+(k===st.idx?' cur':'');const r=revealed(qj),x=st.ans[qj];
    if(x!==undefined) c+= r ? (x===Q[qj].a?' ok':' bad') : ' done';
    return `<button class="${c}" data-go="${k}" aria-label="第${k+1}題">${k+1}</button>`}).join('')}</div>` : '';
  const opts=q.o.map((t,i)=>{
    let c='opt';
    if(rev){c+= i===q.a?' ok':(i===a?' bad':' dim')} else if(i===a){c+=' sel'}
    return `<button class="${c}" data-pick="${i}" aria-disabled="${rev}"><span class="l">${L[i]}</span><span>${esc(t)}</span></button>`}).join('');
  let fb='';
  if(rev){
    if(a===undefined) fb=`<div class="fb bad">未作答，正確答案是 ${L[q.a]}</div>`;
    else if(a===q.a) fb=`<div class="fb ok">答對了</div>`;
    else fb=`<div class="fb bad">答錯了，正確答案是 ${L[q.a]}</div>`;
  }
  return `<div class="meta"><span>第 ${st.idx+1} / ${N} 題，已答 ${done} 題</span>
   <span style="display:flex;gap:8px"><button class="chip" data-act="grid">題號</button>${top}</span></div>
  <div class="prog"><i style="width:${(st.idx+1)/N*100}%"></i></div>${grid}
  <div class="card"><div class="tab"><span>原題 ${q.n}</span><span>${q.p} 分</span></div>
  <p class="q">${esc(q.q)}</p><div class="opts">${opts}</div>${fb}</div>
  <div class="nav"><button class="btn" data-go="${st.idx-1}" ${st.idx===0?'disabled':''}>上一題</button>
  <button class="btn pri" data-go="${st.idx+1}" ${st.idx===N-1?'disabled':''}>下一題</button></div>`;
}

function resultHTML(){
  let score=0,pts=0,right=0;const wrong=[];
  st.order.forEach(qi=>{const q=Q[qi];pts+=q.p;if(st.ans[qi]===q.a){score+=q.p;right++}else wrong.push(qi)});
  const list=wrong.map(qi=>{const q=Q[qi],a=st.ans[qi];
    return `<div class="wr"><b>${esc(q.q)}</b><br>
    <span class="a">你的答案：${a===undefined?'未作答':L[a]+'. '+esc(q.o[a])}</span><br>
    <span class="c">正確答案：${L[q.a]}. ${esc(q.o[q.a])}</span></div>`}).join('');
  return `<div class="card hero"><p>得分</p><div class="score">${fmt(score)} <span style="font-size:20px;font-weight:400">/ ${fmt(pts)}</span></div>
  <div class="stats"><span>答對 ${right} 題</span><span>答錯或未答 ${wrong.length} 題</span><span>正確率 ${Math.round(right/st.order.length*100)}%</span></div>
  <div class="stack">
   ${wrong.length?`<button class="btn pri" data-act="retry">只重做錯題（${wrong.length} 題）</button>`:''}
   <button class="btn" data-act="review">逐題檢視全部題目</button>
   <button class="btn" data-act="restart">重新隨機開始</button></div></div>
  ${wrong.length?`<h3>錯題整理</h3>${list}`:'<h3>全部答對！</h3>'}`;
}

function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===st.mode)));
  $('#app').innerHTML = st.view==='start'?startHTML():st.view==='quiz'?quizHTML():resultHTML();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mode){st.mode=t.dataset.mode;st.confirm=false;render();return}
  if(t.dataset.pick!==undefined){pick(+t.dataset.pick);return}
  if(t.dataset.go!==undefined){if(!t.disabled)go(+t.dataset.go);return}
  switch(t.dataset.act){
    case 'start':case 'restart':start();break;
    case 'grid':st.grid=!st.grid;render();break;
    case 'finish':finish();break;
    case 'result':st.view='result';render();window.scrollTo(0,0);break;
    case 'review':st.view='quiz';st.idx=0;st.grid=false;render();window.scrollTo(0,0);break;
    case 'retry':start(st.order.filter(qi=>st.ans[qi]!==Q[qi].a));break;
  }
});
document.addEventListener('keydown',e=>{
  if(st.view!=='quiz')return;
  const k=e.key.toUpperCase();
  if('ABCD'.includes(k)&&k.length===1)pick('ABCD'.indexOf(k));
  else if(k>='1'&&k<='4')pick(+k-1);
  else if(e.key==='ArrowRight')go(st.idx+1);
  else if(e.key==='ArrowLeft')go(st.idx-1);
});
render();
</script>
</body>
</html>
